name: leaddesk-automation
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:5678:5678'
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run node scripts/setup-n8n.mjs first}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5679/
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_CONCURRENCY_PRODUCTION_LIMIT: '1'
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '24'
    volumes:
      - n8n_data:/home/node/.n8n

  webhook-gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - '127.0.0.1:5679:8080'
    volumes:
      - ./webhook-gateway.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      - webhook-gateway
    command: tunnel --no-autoupdate --url http://webhook-gateway:8080

volumes:
  n8n_data:
